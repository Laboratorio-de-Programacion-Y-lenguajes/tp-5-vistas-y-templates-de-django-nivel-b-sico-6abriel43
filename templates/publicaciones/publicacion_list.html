{% extends "base.html" %}

{% block content %}
<h2>Listado de Publicaciones</h2>
<ul> 
{% for pub in publicacion_list %}
    <li>
        <strong>{{ pub.titulo }}</strong> - {{ pub.autor }}
        <br>
        <a href="{% url 'publicaciones:detalle_publicacion' publicacion_id=pub.pk %}">Ver detalle</a>
    </li>
{% empty %}
    <li>No hay publicaciones disponibles aún.</li>
{% endfor %}
</ul>
{% endblock %}
