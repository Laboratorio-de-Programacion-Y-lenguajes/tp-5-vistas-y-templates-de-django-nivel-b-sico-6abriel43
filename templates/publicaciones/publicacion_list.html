    Requisitos:
    - Extender base.html
    - Sobreescribir {% block content %}
    - Dentro del bloque:
        - Un título de sección (<h1> o <h2>)
        - Recorrer la lista con {% for pub in publicacion_list %}
        - Por cada publicación mostrar:
            - Título ({{ pub.titulo }})
            - Autor ({{ pub.autor }})
            - Fecha de publicación ({{ pub.fecha_publicacion }})
            - Un link al detalle usando {% url 'publicaciones:detalle_publicacion' pub.pk %}
        - Cerrar con {% endfor %}
        - Si no hay publicaciones, usar {% empty %} dentro del for para mostrar un mensaje

    Pista para el {% empty %}:
        {% for pub in publicacion_list %}
            ...
        {% empty %}
            <p>No hay publicaciones disponibles aún.</p>
        {% endfor %}
-->

{% extends "base.html" %}
{% block content %}
<h1>Listado de Publicaciones</h1>
<ul> 
{% for post in posts %}
<li>
    <strong> {{post.titulo}} </strong> -
    <a href="{% url 'publicaciones:detalle_publicacion' post.pk %}">Ver detalle</a>
</li>
{% empty %}
<li>No hay publicaciones disponibles aún.</li>
{% endfor %}
</ul>
{% endblock %}
